
name: Build Xio Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Xio Launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        id: project
        run: |
          FILE=$(find . -name settings.gradle.kts \
            -o -name settings.gradle | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload Xio APK
        uses: actions/upload-artifact@v4
        with:
          name: Xio-Launcher-V0.1
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
