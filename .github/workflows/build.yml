
name: Build Xio Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Xio Launcher V0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        run: |
          echo "Checking Xio Launcher files..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Xio project files found!"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Xio APK
        uses: actions/upload-artifact@v4
        with:
          name: Xio-Launcher-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
